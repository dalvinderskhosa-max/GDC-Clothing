[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Env vars (SHOPIFY_STORE_DOMAIN, SHOPIFY_STOREFRONT_ACCESS_TOKEN,
# SHOPIFY_ADMIN_API_TOKEN, SHOPIFY_API_VERSION, NEXT_PUBLIC_SITE_URL)
# must be set in the Netlify dashboard: Site settings > Environment variables.
